name: Langulus CI
on: push
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022] # windows-latest uses vs2026, which uses clangcl 22, which is full of regressions in concept compilation
        build: [release]
        cxx: [g++-14, clang++-21, clangcl, emcc] # v143/v145 suppport has been dropped indefinitely due to too many compiler bugs and bad C++23 support. tested on v145, too - not there yet. just use clangcl, please.
        arch: [x86, x64]
        feature: [
          [NoSIMD, 16, ' ',         '/arch:IA32'],
          [SSE2,   16, '-msse2',    '/arch:SSE2'],
          [SSE3,   16, '-msse3',    '<not available on msvc>'],
          [SSSE3,  16, '-mssse3',   '<not available on msvc>'],
          [SSE4.1, 16, '-msse4.1',  '<not available on msvc>'],
          [SSE4.2, 16, '-msse4.2',  '<not available on msvc>'],
          [AVX,    32, '-mavx',     '/arch:AVX'],
          [AVX2,   32, '-mavx2',    '/arch:AVX2'],
          [AVX512, 64, '-mavx512f', '/arch:AVX512']
        ]

        exclude:
          - cxx: emcc
            arch: x64
          - os: ubuntu-24.04
            cxx: v143
          - os: ubuntu-24.04
            cxx: clangcl
          - os: windows-2022
            cxx: g++-14
          - os: windows-2022
            cxx: clang++-21

          - arch: x64
            cxx: clangcl
            feature: [SSE2, 16, '-msse2', '/arch:SSE2']
          - arch: x64
            cxx: clangcl
            feature: [SSE3, 16, '-msse3', '<not available on msvc>']
          - arch: x64
            cxx: clangcl
            feature: [SSSE3, 16, '-mssse3', '<not available on msvc>']
          - arch: x64
            cxx: clangcl
            feature: [SSE4.1, 16, '-msse4.1', '<not available on msvc>']
          - arch: x64
            cxx: clangcl
            feature: [SSE4.2, 16, '-msse4.2', '<not available on msvc>']

          - arch: x86
            cxx: clangcl
            feature: [SSE3, 16, '-msse3', '<not available on msvc>']
          - arch: x86
            cxx: clangcl
            feature: [SSSE3, 16, '-mssse3', '<not available on msvc>']
          - arch: x86
            cxx: clangcl
            feature: [SSE4.1, 16, '-msse4.1', '<not available on msvc>']
          - arch: x86
            cxx: clangcl
            feature: [SSE4.2, 16, '-msse4.2', '<not available on msvc>']

          - arch: x64
            cxx: v143
            feature: [SSE2, 16, '-msse2', '/arch:SSE2']
          - arch: x64
            cxx: v143
            feature: [SSE3, 16, '-msse3', '<not available on msvc>']
          - arch: x64
            cxx: v143
            feature: [SSSE3, 16, '-mssse3', '<not available on msvc>']
          - arch: x64
            cxx: v143
            feature: [SSE4.1, 16, '-msse4.1', '<not available on msvc>']
          - arch: x64
            cxx: v143
            feature: [SSE4.2, 16, '-msse4.2', '<not available on msvc>']

          # I can't even begin to describe how much grief has msvc x86 compiler given me!
          # 32bit v143 compiler support is very neglected and produces a lot of constexpr related ICEs, 
          # wrong code generation, and ridiculously long compile-times (we're talking about HOURS)
          # I've been suffering for years before I finally gave up and excluded it.
          # Sorry, but only the noSIMD version is supported.
          # see https://github.com/Langulus/SIMD/issues/22 for more info and updates on the situation
          - arch: x86
            cxx: v143
            feature: [SSE2, 16, '-msse2', '/arch:SSE2']
          - arch: x86
            cxx: v143
            feature: [SSE3, 16, '-msse3', '<not available on msvc>']
          - arch: x86
            cxx: v143
            feature: [SSSE3, 16, '-mssse3', '<not available on msvc>']
          - arch: x86
            cxx: v143
            feature: [SSE4.1, 16, '-msse4.1', '<not available on msvc>']
          - arch: x86
            cxx: v143
            feature: [SSE4.2, 16, '-msse4.2', '<not available on msvc>']
          - arch: x86
            cxx: v143
            feature: [AVX, 32, '-mavx', '/arch:AVX']
          - arch: x86
            cxx: v143
            feature: [AVX2, 32, '-mavx2', '/arch:AVX2']

          # Seems the cloud at github doesn't have the avx512 extensions
          - feature: [AVX512, 64, '-mavx512f', '/arch:AVX512']

        include:
          - cxx: emcc
            c: emcc
          - cxx: g++-14
            c: gcc-14
          - cxx: clang++-21
            c: clang-21
          - os: ubuntu-24.04
            arch: x86
            cmake_args: "-DCMAKE_CXX_FLAGS=-m32"
          - os: ubuntu-24.04
            arch: x64
            cmake_args: "-DCMAKE_CXX_FLAGS=-m64"
          - os: windows-2022
            arch: x86
            cmake_args: "-G \"Visual Studio 17 2022\" -A Win32"
          - os: windows-2022
            arch: x64
            cmake_args: "-G \"Visual Studio 17 2022\" -A x64"

    name: "${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}-${{matrix.feature[0]}}"
    runs-on: ${{matrix.os}}
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86' && matrix.cxx != 'emcc'
        name: Prepare for cross-compilation (Linux)
        run: |
          sudo apt update
          sudo apt install g++-14-multilib

      - if: matrix.os == 'ubuntu-24.04' && matrix.cxx == 'emcc'
        name: Prepate environment (Linux with emscripten)
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          git pull
          ./emsdk install latest
          ./emsdk activate latest

      - if: matrix.cxx == 'clang++-21'
        name: Installing Clang 21 (Linux)
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-add-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt update
          sudo apt install clang-21

      #- if: matrix.os == 'ubuntu-24.04'
      #  name: Install dependencies on Linux
      #  run: |
      #    sudo apt update
      #    sudo apt install libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      - if: matrix.os == 'ubuntu-24.04' && matrix.cxx != 'emcc'
        name: Configure (Linux)
        run: >
          mkdir build && cd build && cmake ..
          -DCMAKE_C_COMPILER=${{matrix.c}}
          -DCMAKE_CXX_COMPILER=${{matrix.cxx}}
          ${{matrix.cmake_args}}
          -DCMAKE_BUILD_TYPE=${{matrix.build}}
          -DLANGULUS_BUILD_ID=\"${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}-${{matrix.feature[0]}}-${{github.ref_name}}-${{github.sha}}\"
          -DCMAKE_C_FLAGS="${{matrix.feature[2]}}"
          -DCMAKE_CXX_FLAGS="${{matrix.feature[2]}}"
          -DLANGULUS_ALIGNMENT=${{matrix.feature[1]}}
          -DLANGULUS_OPTION_TESTING=ON

      - if: matrix.os == 'ubuntu-24.04' && matrix.cxx == 'emcc'
        name: Configure (Linux with emscripten)
        run: >
          source "/home/runner/work/Langulus/Langulus/emsdk/emsdk_env.sh" && mkdir build && cd build && emcmake cmake ..
          -DCMAKE_C_COMPILER=${{matrix.c}}
          -DCMAKE_CXX_COMPILER=${{matrix.cxx}}
          ${{matrix.cmake_args}}
          -DCMAKE_BUILD_TYPE=${{matrix.build}}
          -DLANGULUS_BUILD_ID=\"${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}-${{matrix.feature[0]}}-${{github.ref_name}}-${{github.sha}}\"
          -DCMAKE_C_FLAGS="${{matrix.feature[2]}}"
          -DCMAKE_CXX_FLAGS="${{matrix.feature[2]}}"
          -DLANGULUS_ALIGNMENT=${{matrix.feature[1]}}
          -DLANGULUS_OPTION_TESTING=ON

      - if: matrix.os == 'windows-2022' && matrix.cxx == 'emcc'
        name: Prepate environment (Windows with emscripten)
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          git pull
          ./emsdk.bat install latest
          ./emsdk.bat activate latest --permanent

      - if: matrix.os == 'windows-2022' && matrix.cxx != 'emcc'
        name: Configure (Windows with VS2022)
        run: >
          mkdir build && cd build && cmake ..
          ${{matrix.cmake_args}} -T "${{matrix.cxx}}"
          -DCMAKE_BUILD_TYPE=${{matrix.build}}
          -DLANGULUS_BUILD_ID=\"${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}-${{matrix.feature[0]}}-${{github.ref_name}}-${{github.sha}}\"
          -DCMAKE_CXX_FLAGS="${{matrix.feature[3]}} /EHsc"
          -DLANGULUS_ALIGNMENT=${{matrix.feature[1]}}
          -DLANGULUS_OPTION_TESTING=ON

      - if: matrix.os == 'windows-2022' && matrix.cxx == 'emcc'
        name: Configure (Windows with emscripten)
        run: >
          mkdir build && cd build && python D:\a\Langulus\Langulus\emsdk\upstream\emscripten\emcmake.py cmake ..
          ${{matrix.cmake_args}}
          -DCMAKE_BUILD_TYPE=${{matrix.build}}
          -DLANGULUS_BUILD_ID=\"${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}-${{matrix.feature[0]}}-${{github.ref_name}}-${{github.sha}}\"
          -DCMAKE_CXX_FLAGS="${{matrix.feature[3]}} /EHsc"
          -DLANGULUS_ALIGNMENT=${{matrix.feature[1]}}
          -DLANGULUS_OPTION_TESTING=ON

      - name: Build
        run: cmake --build build -j1 --config ${{matrix.build}}  # minimizing parallelism to save runner RAM

      - name: Test
        run: cd build && ctest -V -C ${{matrix.build}}
        timeout-minutes: 10
        
      - name: 'Upload artifacts'
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: "artifacts-${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}-${{matrix.feature[0]}}-${{github.ref_name}}-${{github.sha}}"
          path: |
            build/bin/*.txt
            build/bin/*.htm
          retention-days: 7